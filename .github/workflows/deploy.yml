name: Build, Push, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  # ── Job 1: Build Docker image and push to Docker Hub ────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # QEMU enables building ARM64 images on the x86 GitHub Actions runner.
      # Required if your Oracle VM is an Ampere A1 (arm64) instance.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tracespring
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Builds for both Intel/AMD (amd64) and Oracle Ampere A1 (arm64).
          # If your VM is amd64-only you can simplify to: platforms: linux/amd64
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: SSH into Oracle VM and redeploy ───────────────────────────────────
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tracespring:latest
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          port:     22
          envs:     DOCKER_IMAGE
          script: |
            set -e

            echo "==> Pulling latest image: $DOCKER_IMAGE"
            docker pull "$DOCKER_IMAGE"

            echo "==> Stopping existing container (if any)"
            docker stop tracespring 2>/dev/null || true
            docker rm   tracespring 2>/dev/null || true

            echo "==> Starting new container"
            docker run -d \
              --name tracespring \
              --restart unless-stopped \
              -p 8082:8082 \
              "$DOCKER_IMAGE"

            echo "==> Waiting for health check"
            sleep 10
            docker inspect --format='{{.State.Health.Status}}' tracespring

            echo "==> Pruning dangling images"
            docker image prune -f
